services:
  - type: web
    name: mateai-data-assistant-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: MAX_TOKENS
        value: "400"
      - key: ALLOWED_ORIGINS
        value: https://mateai-web-jk4v-two.vercel.app,https://trymateai.com,http://localhost:5500
